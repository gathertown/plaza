# Runs only in the public gathertown/plaza repo, where the publisher copies modules/gather-oss to the
# root and this file lands at .github/workflows/publish.yml. GitHub ignores it in the monorepo because
# it sits outside the root .github.
#
# Publishes to npm when a sync lands a version npm doesn't have yet, then tags it and cuts the GitHub
# release. The build job never sees the publish credential, so a dependency's install script can't
# publish anything.

name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A running publish is never cancelled, but GitHub keeps one pending run, so a third quick sync cancels the
# pending one. The newest run still publishes the current version because each sync carries the whole tree, and
# workflow_dispatch re-runs the check by hand.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      unpublished: ${{ steps.version.outputs.unpublished }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - id: version
        name: Find out whether npm has this version
        # The registry answers 404 only for a missing version, so a network error fails the job instead of
        # reading as unpublished.
        run: |
          version=$(jq -r .version package.json)
          status=$(curl -sS -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/@gathertown/plaza/$version")
          case "$status" in
            200) unpublished=false ;;
            404) unpublished=true ;;
            *) echo "npm registry answered $status for $version" && exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "unpublished=$unpublished" >> "$GITHUB_OUTPUT"
          echo "$version unpublished=$unpublished" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: check
    if: needs.check.outputs.unpublished == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Refuse anything but a sync commit
        run: |
          git log -1 --format=%s | grep -Eq '^Sync from gather-town-v2@[0-9a-f]{7,40}$'
          git log -1 --format=%s >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24.22.1"
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx tsc -p tsconfig.json && npx tsc -p tsconfig.esm.json
      - name: Drop the lint scripts and nx block, which only work in Gather's monorepo
        run: npm pkg delete scripts.lint scripts.lint:fix nx
      - run: npm pack --dry-run && npm pack
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tarball
          path: "*.tgz"

  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24.22.1"
          registry-url: "https://registry.npmjs.org"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tarball
      - run: npm publish ./*.tgz --provenance --access public

  release:
    needs: [check, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Tag the sync commit and cut the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --generate-notes
